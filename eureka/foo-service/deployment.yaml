apiVersion: apps/v1
kind: Deployment
metadata:
  name: eu-hello
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eu-hello
  template:
    metadata:
      labels:
        app: eu-hello
    spec:
      containers:
        - name: eu-hello
          image: localhost:5000/eu-hello:latest
          ports:
            - containerPort: 8080
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka.default.svc.cluster.local:8761/eureka/"
            - name: SPRING_APPLICATION_NAME
              value: "eu-hello"
            - name: SERVER_PORT
              value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: eu-hello
spec:
  selector:
    app: eu-hello
  ports:
    - port: 8080
      targetPort: 8080