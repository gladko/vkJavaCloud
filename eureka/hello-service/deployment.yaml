apiVersion: apps/v1
kind: Deployment
metadata:
  name: eu-hello
spec:
  replicas: 3
  selector:
    matchLabels:
      app: eu-hello
  template:
    metadata:
      labels:
        app: eu-hello
    spec:
      containers:
        - name: eu-hello
          image: localhost:5000/eu-hello:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: EUREKA_URL
              # service name
              value: "http://eureka:8761/eureka/"
            - name: SPRING_APPLICATION_NAME
              value: "eu-hello-service"
            - name: SERVER_PORT
              value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: eu-hello
spec:
  selector:
    app: eu-hello
  ports:
    - port: 8080
      targetPort: 8080