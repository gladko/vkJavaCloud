apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-deployment
  labels:
    app: hello-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hello-app
  template:
    metadata:
      labels:
        app: hello-app
    spec:
      containers:
        - name: hello-container
          image: hello-service:latest
          ports:
            - containerPort: 8081