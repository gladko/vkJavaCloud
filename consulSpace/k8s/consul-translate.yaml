apiVersion: apps/v1
kind: Deployment
metadata:
  name: consul-translate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consul-translate
  template:
    metadata:
      labels:
        app: consul-translate
    spec:
      containers:
        - name: consul-translate
          image: consul-translate:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: SPRING_CLOUD_CONSUL_HOST
              value: consul

---
apiVersion: v1
kind: Service
metadata:
  name: consul-translate
spec:
  type: NodePort
  selector:
    app: consul-translate
  ports:
    - port: 8080
      targetPort: 8080