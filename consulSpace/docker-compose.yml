services:
  my-consul:
    image: consul:1.15.4
    restart: always
    ports:
      - "8500:8500"

  consul-translate:
    image: localhost:5000/consul-translate
    deploy: # works only in swarm mode (docker stack deploy).
      replicas: 3
      restart_policy:
        condition: on-failure
    ports:
      - "18000:18080"
    environment:
      - SERVER_PORT=18000
      - SPRING_CLOUD_CONSUL_HOST=my-consul

  consul-main:
    image: localhost:5000/consul-main
    ports:
      - "8080:8080"
    environment:
      - SPRING_CLOUD_CONSUL_HOST=my-consul