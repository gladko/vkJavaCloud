services:
  zoo:
    image: zookeeper
    restart: always
    ports:
      - "2181:2181"
      - "2180:8080"

  zk-translate:
    image: localhost:5000/zk-translate
    deploy: # works only in swarm mode (docker stack deploy).
      replicas: 3
      restart_policy:
        condition: on-failure
    ports:
      - "18000:18000"
    environment:
      - SERVER_PORT=18000
      - SPRING_CLOUD_ZOOKEEPER_CONNECT-STRING=zoo:2181

  zk-main:
    image: localhost:5000/zk-main
    ports:
      - "8080:8080"
    environment:
      - SPRING_CLOUD_ZOOKEEPER_CONNECT-STRING=zoo:2181
