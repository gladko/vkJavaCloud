spring:
  application:
    name: zk-main
server:
  port: 8080

translate-service-name: zk-translate

endpoints:
  restart:
    enabled: true
  shutdown:
    enabled: true
  health:
    sensitive: false

logging.level:
  org.apache.zookeeper.ClientCnxn: ERROR

management:
  security:
    enabled: false