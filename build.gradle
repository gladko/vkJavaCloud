import com.bmuschko.gradle.docker.tasks.image.DockerBuildImage

buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

plugins {
    id 'org.springframework.boot'
    id 'com.bmuschko.docker-remote-api'
}
//apply from: '../../docker.gradle'

tasks.register('buildEurekaImages') {
    dependsOn ":eureka-server:buildDockerImage"
    dependsOn ":eu-hello:buildDockerImage"
    dependsOn ":eu-foo:buildDockerImage"
}

tasks.register('buildZkImages') {
    dependsOn ":zk-hello:buildDockerImage"
    dependsOn ":zk-foo:buildDockerImage"
}

tasks.register('buildConsulImages') {
    dependsOn ":consul-hello:buildDockerImage"
    dependsOn ":consul-foo:buildDockerImage"
}

allprojects {
    group = 'vk.vkPets'
    version = '0.0.1'

    repositories {
        mavenLocal()
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'java-library'
    apply plugin: 'idea'
    apply plugin: 'com.bmuschko.docker-remote-api'
//    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    dependencies {
        compileOnly 'org.jetbrains:annotations:19.0.0'
        testCompileOnly 'org.jetbrains:annotations:19.0.0'
    }

    test {
        useJUnitPlatform()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        }
    }

    tasks.register('buildDockerImage', DockerBuildImage) {
        dependsOn build       // make sure the JAR exists
        inputDir = project.projectDir
        images.add("${project.name}:latest")
    }
}