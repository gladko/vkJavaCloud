pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
    plugins {
        id 'org.springframework.boot' version '3.3.0'
        id 'com.bmuschko.docker-remote-api' version '9.4.0'
    }
}

include 'consulSpace:sandbox'
include 'consulSpace:consul-main'
include 'consulSpace:consul-translate'

include 'etcdSpace:sandbox'

include 'eurekaSpace:eureka'
include 'eurekaSpace:sandbox'
include 'eurekaSpace:eu-main'
include 'eurekaSpace:eu-translate'

include 'k8sSpace:clientSandbox'

include 'zookeeperSpace:hazelcastZkSpi'
include 'zookeeperSpace:sandbox'
include 'zookeeperSpace:zk-main'
include 'zookeeperSpace:zk-translate'

include 'spring-config:config-server'
include 'spring-config:client'

include 'spring-k8s:discoveryserver'
include 'spring-k8s:spring-k8s-main'
include 'spring-k8s:spring-k8s-translate'
