pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
    plugins {
        id 'org.springframework.boot' version '3.3.0'
        id 'com.bmuschko.docker-remote-api' version '9.4.0'
    }
}

include 'config-server'
include 'config-client'

include 'etcd-sandbox'
include 'k8s-sandbox'

//include 'eurekaSpace'
include 'eureka', 'eu-sandbox', 'eu-main', 'eu-translate'
include 'zk-sandbox', 'zk-hazelcast', 'zk-main', 'zk-translate'
include 'consul-sandbox', 'consul-main', 'consul-translate'

project(':consul-sandbox').projectDir = file('consulSpace/sandbox')
project(':consul-main').projectDir = file('consulSpace/consul-main')
project(':consul-translate').projectDir = file('consulSpace/consul-translate')

project(':etcd-sandbox').projectDir = file('etcdSpace/sandbox')

project(':k8s-sandbox').projectDir = file('k8sSpace/clientSandbox')

project(':eureka').projectDir = file('eurekaSpace/eureka')
project(':eu-sandbox').projectDir = file('eurekaSpace/sandbox')
project(':eu-main').projectDir = file('eurekaSpace/eu-main')
project(':eu-translate').projectDir = file('eurekaSpace/eu-translate')

project(':zk-sandbox').projectDir = file('zookeeperSpace/sandbox')
project(':zk-hazelcast').projectDir = file('zookeeperSpace/hazelcastZkSpi')
project(':zk-main').projectDir = file('zookeeperSpace/zk-main')
project(':zk-translate').projectDir = file('zookeeperSpace/zk-translate')


project(':config-server').projectDir = file('spring-config/config-server')
project(':config-client').projectDir = file('spring-config/client')
