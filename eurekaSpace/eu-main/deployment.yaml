apiVersion: apps/v1
kind: Deployment
metadata:
  name: eu-foo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: eu-foo
  template:
    metadata:
      labels:
        app: eu-foo
    spec:
      containers:
        - name: eu-foo
          image: localhost:5000/eu-foo:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: EUREKA_URL
              # DNS name
              value: "http://eureka.default.svc.cluster.local:8761/eureka/"
            - name: SPRING_APPLICATION_NAME
              value: "eu-foo-service"
            - name: SERVER_PORT
              value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: eu-foo
spec:
  type: NodePort
  selector:
    app: eu-foo
  ports:
    - port: 8080
      targetPort: 8080