apiVersion: apps/v1
kind: Deployment
metadata:
  name: eu-main
spec:
  replicas: 3
  selector:
    matchLabels:
      app: eu-main
  template:
    metadata:
      labels:
        app: eu-main
    spec:
      containers:
        - name: eu-main
          image: localhost:5000/eu-main:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: EUREKA_URL
              # DNS name
              value: "http://eureka.default.svc.cluster.local:8761/eureka/"
#            - name: SPRING_APPLICATION_NAME
#              value: "eu-main"
            - name: SERVER_PORT
              value: "8080"
---
