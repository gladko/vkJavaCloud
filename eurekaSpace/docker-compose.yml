
services:
  eureka:
    image: localhost:5000/eureka
    container_name: eureka
    ports:
      - "8761:8761"

  eu-translate:
    image: localhost:5000/eu-translate
    deploy:         # works only in swarm mode (docker stack deploy).
      replicas: 3
      restart_policy:
        condition: on-failure
    ports:
      - "18000:18000"
    depends_on:
      - eureka
    environment:
      - SERVER_PORT=18000
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_URL=http://eureka:8761/eureka

  eu-main:
    image: localhost:5000/eu-main
    ports:
      - "8080:8080"
    depends_on:
      - eureka
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_URL=http://eureka:8761/eureka