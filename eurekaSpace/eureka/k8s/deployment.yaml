apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka
#  labels:
#    app: hello-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka
  template:
    metadata:
      labels:
        app: eureka
    spec:
      containers:
        - name: eureka
          image: localhost:5000/eureka:latest
          ports:
            - containerPort: 8761
          env:
            - name: EUREKA_SERVER_ENABLE_SELF_RESERVATION
              value: "false"
            - name: EUREKA_INSTANCE_HOSTNAME
              value: "eureka"
            - name: EUREKA_CLIENT_REGISTER_WITH_EUREKA
              value: "false"
            - name: EUREKA_CLIENT_FETCH_REGISTRY
              value: "false"