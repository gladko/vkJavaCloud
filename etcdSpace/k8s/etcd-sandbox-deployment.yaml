apiVersion: apps/v1
kind: Deployment
metadata:
  name: etcd-sandbox
spec:
  replicas: 3
  selector:
    matchLabels:
      app: etcd-sandbox
  template:
    metadata:
      labels:
        app: etcd-sandbox
    spec:
      containers:
        - name: etcd-sandbox
          image: localhost:5000/etcd-sandbox:latest
          ports:
            - containerPort: 7777
          env:
            - name: ETCD_ENDPOINT
              value: http://vk-etcd:2379
---
apiVersion: v1
kind: Service
metadata:
  name: etcd-sandbox
spec:
  clusterIP: None   # Headless Service !!!
  selector:
    app: etcd-sandbox
  ports:
    - port: 7777
      targetPort: 7777