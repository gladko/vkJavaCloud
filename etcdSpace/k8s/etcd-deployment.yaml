apiVersion: apps/v1
kind: Deployment
metadata:
  name: vk-etcd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vk-etcd
  template:
    metadata:
      labels:
        app: vk-etcd
    spec:
      containers:
        - name: etcd
          image: localhost:5000/vk-etcd:latest
          ports:
            - containerPort: 2379
            - containerPort: 2380
          args:
            - --data-dir=/etcd-data
            - --name=default
            - --listen-client-urls=http://0.0.0.0:2379
            - --advertise-client-urls=http://0.0.0.0:2379
            # For single-node, you can omit --listen-peer-urls or set as needed
          volumeMounts:
            - name: etcd-data
              mountPath: /etcd-data
      volumes:
        - name: etcd-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vk-etcd
spec:
  selector:
    app: vk-etcd
  ports:
    - name: xxx
      port: 2379
      targetPort: 2379
    - name: yyy
      port: 2380
      targetPort: 2380