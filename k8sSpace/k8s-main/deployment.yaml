apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-main
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-main
  template:
    metadata:
      labels:
        app: k8s-main
    spec:
      containers:
        - name: k8s-main
          image: k8s-main:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: TRANSLATE-SERVICE-ADDRESS
              value: http://k8s-translate:8080
            - name: GRPC_CLIENT_GREETING_ADDRESS
              value: static://k8s-translate:9090
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-main
spec:
  type: NodePort
  selector:
    app: k8s-main
  ports:
    - port: 8080
      targetPort: 8080