apiVersion: apps/v1

kind: Deployment
metadata:
  name: just-hello
  labels:
    app: just-hello
spec:
  replicas: 3
  selector:
    matchLabels:
      app: just-hello
  template:
    metadata:
      labels:
        app: just-hello
    spec:
      containers:
        - name: just-hello
          image: just-hello:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: just-hello
spec:
  selector:
    app: just-hello
  ports:
    - protocol: TCP
      port: 80          # service port
      targetPort: 8080  # container port your app listens on (must match to containers.ports.containerPort)
#  type: NodePort
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: just-hello
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: vk-hello.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: just-hello
                port:
                  number: 80