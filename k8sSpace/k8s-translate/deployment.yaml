apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-translate
spec:
  replicas: 3
  selector:
    matchLabels:
      app: k8s-translate
  template:
    metadata:
      labels:
        app: k8s-translate
    spec:
      containers:
        - name: k8s-translate
          image: k8s-translate:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-translate
spec:
  selector:
    app: k8s-translate
  ports:
    - port: 8080
      targetPort: 8080