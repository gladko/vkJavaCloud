apiVersion: "stable.example.com/v1"
kind: CronTab
metadata:
  name: nightly-backup-cron
spec:
  cronStmt: "0 2 * * *"
  iconPath: my-awesome-nightly-backup-icon.jpeg
  replicas: 3

