

dependencies {
    implementation 'io.etcd:jetcd-core:0.8.6'
    implementation "com.fasterxml.jackson.core:jackson-databind:2.18.4"

    runtimeOnly "ch.qos.logback:logback-classic:1.5.21" // logging

    testImplementation "org.testcontainers:testcontainers-toxiproxy:${testContainersVersion}"
    testImplementation "org.testcontainers:testcontainers-junit-jupiter:${testContainersVersion}"
    testImplementation "org.testcontainers:testcontainers:${testContainersVersion}"
    testImplementation("io.etcd:jetcd-launcher:0.8.6")

//    implementation platform('org.testcontainers:testcontainers-bom:2.0.2') //import bom
    testImplementation("org.junit.jupiter:junit-jupiter-api:${junitJupiterVersion}")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitJupiterVersion}")
}
